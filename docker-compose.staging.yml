# Staging override for Hetzner CX33 (OPS-01, BUDGET-01).
# Runs alongside production on isolated volumes and ports with bounded memory.

services:
  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storefront_staging}
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
      - ./api/migrations:/docker-entrypoint-initdb.d:ro
    cpus: "0.5"
    mem_limit: 512m

  api:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-storefront}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-storefront_staging}
    cpus: "0.5"
    mem_limit: 512m

  web:
    cpus: "0.5"
    mem_limit: 512m

  caddy:
    ports:
      - "8081:80"
      - "8443:443"
    environment:
      SITE_DOMAIN: ${STAGING_SITE_DOMAIN:-staging.localhost}
    cpus: "0.25"
    mem_limit: 256m

volumes:
  pgdata_staging:
